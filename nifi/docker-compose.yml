services:
  nifi:
    image: apache/nifi:2.9.0
    container_name: nifi
    ports:
      - "8090:8443"
    environment:
      - SINGLE_USER_CREDENTIALS_USERNAME=admin
      - SINGLE_USER_CREDENTIALS_PASSWORD=admin123456789
      - NIFI_WEB_HTTPS_HOST=0.0.0.0
      - NIFI_WEB_HTTPS_PORT=8443
      - NIFI_WEB_PROXY_HOST=vps.scarsi.com.br:8090
    volumes:
      - ./data:/opt/nifi/nifi-current/data
      - ./logs:/opt/nifi/nifi-current/logs
      - ./drivers:/opt/nifi/nifi-current/drivers
      - ./conf:/opt/nifi/nifi-current/conf
    restart: unless-stopped
    mem_limit: 4g
    cpus: 1.0